name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches MARKETING_VERSION
        run: |
          version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' project.yml | head -n1)"
          tag="${GITHUB_REF_NAME#v}"
          echo "project.yml: $version, tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.yml"
            exit 1
          fi

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Swift tests (WidgeeKit)
        working-directory: Packages/WidgeeKit
        run: swift test

      - name: Build DMG
        run: scripts/build-dmg.sh

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 Widgee-*.dmg | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/Widgee-*.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
