name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: brew install xcodegen

      - name: Swift tests (WidgeeKit)
        working-directory: Packages/WidgeeKit
        run: swift test

      # ES module loading relies on private JavaScriptCore APIs (see SPEC, "Риски").
      # Run these tests as a separate, explicit step so a macOS change is easy to spot.
      - name: ES module loading tests (private JavaScriptCore APIs)
        working-directory: Packages/WidgeeKit
        run: swift test --filter WidgetHostTests

      - name: Build app (unsigned)
        run: |
          xcodegen generate
          xcodebuild -project Widgee.xcodeproj -scheme Widgee -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
