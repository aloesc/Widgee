<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widgee banner</title>
<style>
  :root {
    --ink: #14172b;
    --muted: #4a4f6d;
    --blue: #0a84ff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 560px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 520px at 8% 0%, #ffffff 0%, rgba(255,255,255,0) 70%),
      radial-gradient(700px 500px at 100% 0%, #a8c6ff 0%, rgba(168,198,255,0) 70%),
      linear-gradient(135deg, #f1f0ff 0%, #d9e0ff 45%, #b9ceff 100%);
    position: relative;
  }
  /* волны на фоне */
  .wave { position: absolute; inset: 0; }
  .wave svg { width: 100%; height: 100%; display: block; }

  .brand { position: absolute; left: 118px; top: 0; bottom: 0; display: flex; align-items: center; gap: 44px; }
  .icon {
    width: 230px; height: 230px; border-radius: 52px; flex: none;
    box-shadow: 0 30px 60px -18px rgba(54, 84, 220, .55), 0 6px 16px rgba(54, 84, 220, .25);
  }
  .icon img { width: 100%; height: 100%; display: block; border-radius: 52px; }
  h1 {
    font-size: 138px; font-weight: 700; letter-spacing: -4px; line-height: 1;
    font-family: "SF Pro Rounded", ui-rounded, -apple-system, sans-serif;
  }
  .tag { margin-top: 12px; font-size: 38px; font-weight: 500; color: var(--muted); letter-spacing: -.3px; }
  .chips { display: flex; gap: 12px; margin-top: 26px; }
  .chip {
    font-size: 21px; font-weight: 600; padding: 8px 18px; border-radius: 999px; color: #2a3cc4;
    background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 4px 14px -6px rgba(40,70,200,.35); backdrop-filter: blur(10px);
  }

  /* карточки-виджеты справа */
  .glass {
    position: absolute; border-radius: 34px;
    background: linear-gradient(145deg, rgba(255,255,255,.75), rgba(255,255,255,.35));
    border: 1.5px solid rgba(255,255,255,.9);
    box-shadow: 0 26px 50px -20px rgba(40, 70, 200, .45), inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter: blur(18px) saturate(1.4);
  }
  .clock { left: 1030px; top: 72px; width: 480px; height: 166px; padding: 22px 32px; }
  .clock .t { font-size: 76px; font-weight: 600; letter-spacing: -2px; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .clock .d { font-size: 27px; font-weight: 600; color: var(--blue); margin-top: 6px; }
  .bars { left: 1030px; top: 256px; width: 280px; height: 236px; padding: 26px 28px; }
  .rings { left: 1326px; top: 256px; width: 184px; height: 236px; display: grid; place-items: center; }
  .rings .lab { position: absolute; font-size: 40px; font-weight: 700; text-align: center; }
  .rings .lab small { display: block; font-size: 17px; font-weight: 600; color: var(--muted); margin-top: -2px; }
  .row { margin-bottom: 20px; }
  .row:last-child { margin-bottom: 0; }
  .row .l { display: flex; justify-content: space-between; font-size: 20px; font-weight: 600; }
  .track { height: 11px; border-radius: 99px; background: rgba(60,70,140,.15); margin-top: 7px; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; }
</style>
</head>
<body>
  <div class="wave">
    <svg viewBox="0 0 1600 560" preserveAspectRatio="none">
      <defs>
        <linearGradient id="w1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c9bdff" stop-opacity=".75"/><stop offset="1" stop-color="#8fb4ff" stop-opacity=".6"/>
        </linearGradient>
        <linearGradient id="w2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7fb0ff" stop-opacity=".55"/><stop offset="1" stop-color="#3f84f0" stop-opacity=".9"/>
        </linearGradient>
      </defs>
      <path d="M0 400 C 260 330 520 470 820 500 C 1100 530 1300 430 1600 470 L1600 560 L0 560 Z" fill="url(#w1)"/>
      <path d="M0 500 C 300 470 560 560 900 520 C 1200 485 1400 420 1600 380 L1600 560 L0 560 Z" fill="url(#w2)"/>
    </svg>
  </div>

  <div class="brand">
    <div class="icon"><img src="../../design/app-icon.png" alt=""></div>
    <div>
      <h1>Widgee</h1>
      <div class="tag">Desktop widgets for macOS 26+</div>
      <div class="chips">
        <span class="chip">Liquid Glass</span>
        <span class="chip">Written in JavaScript</span>
        <span class="chip">Open source</span>
      </div>
    </div>
  </div>

  <div class="glass clock"><div class="t">17:10</div><div class="d">Sunday, 15 Nov</div></div>
  <div class="glass bars">
    <div class="row"><div class="l"><span>CPU</span><span>26%</span></div><div class="track"><div class="fill" style="width:26%;background:#0a84ff"></div></div></div>
    <div class="row"><div class="l"><span>RAM</span><span>74%</span></div><div class="track"><div class="fill" style="width:74%;background:#30d158"></div></div></div>
    <div class="row"><div class="l"><span>Disk</span><span>85%</span></div><div class="track"><div class="fill" style="width:85%;background:#ff9f0a"></div></div></div>
  </div>
  <div class="glass rings">
    <svg width="140" height="140" viewBox="0 0 150 150">
      <circle cx="75" cy="75" r="62" fill="none" stroke="rgba(60,70,140,.15)" stroke-width="16"/>
      <circle cx="75" cy="75" r="62" fill="none" stroke="#30d158" stroke-width="16" stroke-linecap="round"
              stroke-dasharray="308 390" transform="rotate(-90 75 75)"/>
    </svg>
    <div class="lab">79%<small>Battery</small></div>
  </div>
</body>
</html>
